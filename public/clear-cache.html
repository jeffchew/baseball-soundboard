<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clear Cache - Lake Monsters DJ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background: #001c43;
      color: white;
    }
    button {
      background: #0066cc;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      margin: 10px 0;
      width: 100%;
    }
    button:hover {
      background: #0052a3;
    }
    button.secondary {
      background: #ff6b00;
    }
    button.secondary:hover {
      background: #cc5500;
    }
    button.danger {
      background: #dc2626;
    }
    button.danger:hover {
      background: #b91c1c;
    }
    button.back {
      background: #4b5563;
    }
    button.back:hover {
      background: #374151;
    }
    .status {
      margin: 20px 0;
      padding: 15px;
      background: rgba(255,255,255,0.1);
      border-radius: 5px;
    }
    .success {
      background: rgba(0,255,0,0.2);
    }
    .error {
      background: rgba(255,0,0,0.2);
    }
    h1 {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <h1>🧹 Cache & Data Management</h1>
  <p>Manage cached data, service workers, and app settings.</p>
  
  <button onclick="quickClearCache()">⚡ Quick Clear Cache & Reload</button>
  <button onclick="clearAllCaches()">🗑️ Clear All Caches</button>
  <button onclick="unregisterServiceWorker()">🔧 Unregister Service Worker</button>
  <button onclick="resetPlayCounts()" class="secondary">🔄 Reset Play Counts</button>
  <button onclick="clearEverything()" class="danger">🔥 Nuclear Option: Clear Everything</button>
  <button onclick="window.location.href='/'" class="back">← Back to App</button>
  
  <div id="status" class="status"></div>

  <script>
    const status = document.getElementById('status');

    function log(message, isError = false) {
      console.log(message);
      const div = document.createElement('div');
      div.textContent = message;
      div.style.marginBottom = '5px';
      if (isError) div.style.color = '#ff6b6b';
      status.appendChild(div);
    }

    async function clearAllCaches() {
      status.innerHTML = '';
      status.className = 'status';
      
      try {
        log('🗑️ Clearing all caches...');
        
        const cacheNames = await caches.keys();
        log(`Found ${cacheNames.length} cache(s): ${cacheNames.join(', ')}`);
        
        for (const cacheName of cacheNames) {
          await caches.delete(cacheName);
          log(`✅ Deleted cache: ${cacheName}`);
        }
        
        log('✨ All caches cleared successfully!');
        status.className = 'status success';
        
        setTimeout(() => {
          log('🔄 Reloading page in 2 seconds...');
          setTimeout(() => window.location.href = '/', 2000);
        }, 1000);
        
      } catch (error) {
        log(`❌ Error: ${error.message}`, true);
        status.className = 'status error';
      }
    }

    async function quickClearCache() {
      status.innerHTML = '';
      status.className = 'status';
      
      try {
        log('⚡ Quick cache clear...');
        
        // Clear all caches
        const cacheNames = await caches.keys();
        log(`Clearing ${cacheNames.length} cache(s)...`);
        for (const cacheName of cacheNames) {
          const cache = await caches.open(cacheName);
          const keys = await cache.keys();
          await Promise.all(keys.map(key => cache.delete(key)));
        }
        
        // Unregister all service workers
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }
        
        log('✨ Cache cleared and service worker reset!');
        log('🔄 Reloading with fresh files...');
        status.className = 'status success';
        
        setTimeout(() => {
          window.location.reload(true);
        }, 1500);
        
      } catch (error) {
        log(`❌ Error: ${error.message}`, true);
        status.className = 'status error';
      }
    }

    function resetPlayCounts() {
      status.innerHTML = '';
      status.className = 'status';
      
      try {
        log('🔄 Resetting play counts...');
        
        // Clear play count data from localStorage
        const keys = Object.keys(localStorage);
        const playCountKeys = keys.filter(key => key.startsWith('playCount_'));
        
        log(`Found ${playCountKeys.length} play count entries`);
        
        playCountKeys.forEach(key => {
          localStorage.removeItem(key);
          log(`✅ Cleared: ${key}`);
        });
        
        log('✨ Play counts reset successfully!');
        status.className = 'status success';
        
        setTimeout(() => {
          log('🔄 Returning to app in 2 seconds...');
          setTimeout(() => window.location.href = '/', 2000);
        }, 1000);
        
      } catch (error) {
        log(`❌ Error: ${error.message}`, true);
        status.className = 'status error';
      }
    }

    async function unregisterServiceWorker() {
      status.innerHTML = '';
      status.className = 'status';
      
      try {
        log('🔧 Unregistering service workers...');
        
        const registrations = await navigator.serviceWorker.getRegistrations();
        log(`Found ${registrations.length} service worker(s)`);
        
        for (const registration of registrations) {
          await registration.unregister();
          log(`✅ Unregistered service worker: ${registration.scope}`);
        }
        
        log('✨ All service workers unregistered!');
        status.className = 'status success';
        
      } catch (error) {
        log(`❌ Error: ${error.message}`, true);
        status.className = 'status error';
      }
    }

    async function clearEverything() {
      status.innerHTML = '';
      status.className = 'status';
      
      try {
        log('💣 Starting nuclear cleanup...');
        
        // Clear all caches
        const cacheNames = await caches.keys();
        log(`Deleting ${cacheNames.length} cache(s)...`);
        for (const cacheName of cacheNames) {
          await caches.delete(cacheName);
          log(`✅ Deleted: ${cacheName}`);
        }
        
        // Unregister all service workers
        const registrations = await navigator.serviceWorker.getRegistrations();
        log(`Unregistering ${registrations.length} service worker(s)...`);
        for (const registration of registrations) {
          await registration.unregister();
          log(`✅ Unregistered: ${registration.scope}`);
        }
        
        // Clear localStorage
        log('Clearing localStorage...');
        localStorage.clear();
        log('✅ localStorage cleared');
        
        // Clear sessionStorage
        log('Clearing sessionStorage...');
        sessionStorage.clear();
        log('✅ sessionStorage cleared');
        
        log('');
        log('🎉 EVERYTHING CLEARED!');
        log('🔄 Reloading in 3 seconds with hard refresh...');
        status.className = 'status success';
        
        setTimeout(() => {
          // Hard reload with cache bypass
          window.location.href = '/?nocache=' + Date.now();
          window.location.reload(true);
        }, 3000);
        
      } catch (error) {
        log(`❌ Error: ${error.message}`, true);
        status.className = 'status error';
      }
    }

    // Show current cache status on load
    window.addEventListener('load', async () => {
      try {
        const cacheNames = await caches.keys();
        log(`Current caches: ${cacheNames.length > 0 ? cacheNames.join(', ') : 'None'}`);
        
        const registrations = await navigator.serviceWorker.getRegistrations();
        log(`Active service workers: ${registrations.length}`);
        
        // Show play count info
        const keys = Object.keys(localStorage);
        const playCountKeys = keys.filter(key => key.startsWith('playCount_'));
        log(`Play count entries: ${playCountKeys.length}`);
      } catch (error) {
        log(`Error checking status: ${error.message}`, true);
      }
    });
  </script>
</body>
</html>
